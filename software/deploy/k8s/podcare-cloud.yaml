# PodCare CLOUD services on Kubernetes (EKS / AKS / GKE / k3s).
#   kubectl apply -f deploy/k8s/podcare-cloud.yaml
# Before applying: push the image (docker buildx build -t <registry>/podcare:<tag> --push -f deploy/Dockerfile .)
# and replace IMAGE below; set the API key secret; pick a storage class that supports ReadWriteMany
# (EFS / Azure Files / Filestore) - or move bench runs and models to object storage (S3 / Blob / GCS).
# Edge hubs are NOT deployed here: they run docker-compose.edge.yml (or k3s) at home / in the daycare.
apiVersion: v1
kind: Namespace
metadata: { name: podcare }
---
apiVersion: v1
kind: Secret
metadata: { name: podcare-secrets, namespace: podcare }
type: Opaque
stringData:
  API_KEY: change-me
---
apiVersion: v1
kind: ConfigMap
metadata: { name: podcare-config, namespace: podcare }
data:
  CLOUD_DATA: /data
  BENCH_DIR: /data/bench
  REGISTRY_DIR: /data/registry
  INGEST_URL: http://ingest:9001
  RETENTION_DAYS: "365"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: cloud-data, namespace: podcare }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 10Gi } }
  # storageClassName: efs-sc | azurefile | filestore-rwx
---
# ---------- ingest (single writer while on SQLite; switch to managed Postgres to scale out)
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingest, namespace: podcare }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: ingest } }
  template:
    metadata: { labels: { app: ingest } }
    spec:
      containers:
        - name: ingest
          image: IMAGE
          command: ["python", "services/cloud/ingest.py"]
          env: [{ name: PORT, value: "9001" }]
          envFrom: [{ configMapRef: { name: podcare-config } }, { secretRef: { name: podcare-secrets } }]
          ports: [{ containerPort: 9001 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9001 } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: cloud-data } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fleet, namespace: podcare }
spec:
  replicas: 2
  selector: { matchLabels: { app: fleet } }
  template:
    metadata: { labels: { app: fleet } }
    spec:
      containers:
        - name: fleet
          image: IMAGE
          command: ["python", "services/cloud/fleet_service.py"]
          env: [{ name: PORT, value: "9002" }]
          envFrom: [{ configMapRef: { name: podcare-config } }]
          ports: [{ containerPort: 9002 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9002 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: lab, namespace: podcare }
spec:
  replicas: 1
  selector: { matchLabels: { app: lab } }
  template:
    metadata: { labels: { app: lab } }
    spec:
      containers:
        - name: lab
          image: IMAGE
          command: ["python", "services/cloud/lab_service.py"]
          env: [{ name: PORT, value: "9003" }]
          envFrom: [{ configMapRef: { name: podcare-config } }]
          ports: [{ containerPort: 9003 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9003 } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: cloud-data } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: model-registry, namespace: podcare }
spec:
  replicas: 2
  selector: { matchLabels: { app: model-registry } }
  template:
    metadata: { labels: { app: model-registry } }
    spec:
      containers:
        - name: model-registry
          image: IMAGE
          command: ["python", "services/cloud/model_registry.py"]
          env: [{ name: PORT, value: "9004" }]
          envFrom: [{ configMapRef: { name: podcare-config } }]
          ports: [{ containerPort: 9004 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9004 } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /data, readOnly: true }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: cloud-data } }]
---
# ---------- trainer: nightly retrain with all uploaded bench runs, publishes a new model version
apiVersion: batch/v1
kind: CronJob
metadata: { name: trainer, namespace: podcare }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: IMAGE
              command: ["python", "services/cloud/trainer.py"]
              env: [{ name: SESSIONS, value: "300" }]
              envFrom: [{ configMapRef: { name: podcare-config } }]
              resources: { requests: { cpu: "1", memory: 1Gi }, limits: { memory: 2Gi } }
              volumeMounts: [{ name: data, mountPath: /data }]
          volumes: [{ name: data, persistentVolumeClaim: { claimName: cloud-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: ingest, namespace: podcare }
spec: { selector: { app: ingest }, ports: [{ port: 9001, targetPort: 9001 }] }
---
apiVersion: v1
kind: Service
metadata: { name: fleet, namespace: podcare }
spec: { selector: { app: fleet }, ports: [{ port: 9002, targetPort: 9002 }] }
---
apiVersion: v1
kind: Service
metadata: { name: lab, namespace: podcare }
spec: { selector: { app: lab }, ports: [{ port: 9003, targetPort: 9003 }] }
---
apiVersion: v1
kind: Service
metadata: { name: model-registry, namespace: podcare }
spec: { selector: { app: model-registry }, ports: [{ port: 9004, targetPort: 9004 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podcare
  namespace: podcare
  # annotations: { cert-manager.io/cluster-issuer: letsencrypt }   # TLS
spec:
  # ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /v1/models, pathType: Prefix, backend: { service: { name: model-registry, port: { number: 9004 } } } }
          - { path: /v1, pathType: Prefix, backend: { service: { name: ingest, port: { number: 9001 } } } }
          - { path: /lab, pathType: Prefix, backend: { service: { name: lab, port: { number: 9003 } } } }
          - { path: /api/lab, pathType: Prefix, backend: { service: { name: lab, port: { number: 9003 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: fleet, port: { number: 9002 } } } }
