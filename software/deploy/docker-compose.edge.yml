# EDGE stack: runs on the hub next to the baby (Raspberry Pi 4/5, a home hub, or a laptop).
#   docker compose -f deploy/docker-compose.edge.yml up --build
# Parent app: http://<hub>:8000/
#
# Real boards (MODE=serial):
#   Linux hub: uncomment `devices:` under gateway and set PORTS to those devices.
#   macOS / Windows: Docker Desktop can't pass USB serial into containers, so run the gateway
#   natively instead and leave this one at MODE=sim or remove it:
#     MQTT_HOST=localhost MODE=serial python services/edge/gateway.py     (ports auto-detected)
name: podcare-edge

x-app: &app
  image: podcare:latest
  build: { context: .., dockerfile: deploy/Dockerfile }
  restart: unless-stopped
  environment: &env
    MQTT_HOST: mosquitto
    MQTT_PORT: "1883"
    DEVICE_ID: ${DEVICE_ID:-pod-001}
    DHT: ${DHT:-nappy}
  depends_on: [mosquitto]

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["127.0.0.1:1883:1883"]           # hub-local only
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  gateway:
    <<: *app
    command: ["python", "services/edge/gateway.py"]
    environment:
      <<: *env
      MODE: ${MODE:-sim}
      PORTS: ${PORTS:-auto}
      SPEED: ${SPEED:-60}
    # devices:                                # Linux hub with the UNO Q + Nicla plugged in
    #   - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/ttyACM1:/dev/ttyACM1

  inference:
    <<: *app
    command: ["python", "services/edge/inference.py"]
    environment:
      <<: *env
      MODELS_PATH: /data/models.joblib       # written by cloud-sync when a new model is published
      DEMO_HISTORY: ${DEMO_HISTORY:-1}
    volumes: [edge-data:/data]

  parent-api:
    <<: *app
    command: ["python", "services/edge/parent_api.py"]
    ports: ["8000:8000"]                      # home network
    environment:
      <<: *env
      PORT: "8000"

  cloud-sync:
    <<: *app
    command: ["python", "services/edge/cloud_sync.py"]
    environment:
      <<: *env
      SHARE: ${SHARE:-1}                      # opt-in: 0 = nothing leaves the hub
      CLOUD_URL: ${CLOUD_URL:-http://host.docker.internal:9001}
      REGISTRY_URL: ${REGISTRY_URL:-http://host.docker.internal:9004}
      API_KEY: ${API_KEY:-dev-key}
      DATA_DIR: /data
      MODELS_PATH: /data/models.joblib
      SUMMARY_S: ${SUMMARY_S:-60}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [edge-data:/data]

volumes:
  mqtt-data: {}
  edge-data: {}
