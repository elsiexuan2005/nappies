# Edge MQTT broker (runs on the home hub / daycare hub / laptop).
# The port is published on 127.0.0.1 only (see docker-compose.edge.yml), so nothing outside the hub can reach it.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Production hub: require credentials and TLS instead, e.g.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/hub.crt
# keyfile /mosquitto/certs/hub.key
# allow_anonymous false
# password_file /mosquitto/config/passwd
